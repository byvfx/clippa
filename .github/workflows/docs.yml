# Publish the docs site to GitHub Pages on every push to main.
# Does not change the repo's Pages source, custom domain, or DNS. The deploy job
# succeeds only after Settings → Pages → Build and deployment → Source is GitHub Actions.
# Until then, https://byvfx.github.io/clippa/ is still the case study in byvfx/byvfx.github.io.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: false
      - name: Build the docs site
        env:
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
