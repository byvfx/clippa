# A GitHub Release for each version tag: pushing the tag is the release (wiki Developing#releases).
#
#   git tag -a v0.3.0 -m "clipper 0.3.0" && git push origin v0.3.0
#
# Checks the tag against the code and the changelog, builds the wheel and sdist, and publishes
# them with CHANGELOG.md's section for that version as the notes. It deploys nothing and doesn't
# run the tests (check.yml ran them on the commit when it merged to main).
name: release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the whole history, to tell whether the tag is on main
      - uses: astral-sh/setup-uv@v10.3.3
      - name: The tag, the code and the changelog agree, and the tag is on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          in_pyproject=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          in_package=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' clipper/__init__.py)
          [ "$version" = "$in_pyproject" ] || { echo "::error::tag $GITHUB_REF_NAME, but pyproject.toml says $in_pyproject"; exit 1; }
          [ "$version" = "$in_package" ] || { echo "::error::tag $GITHUB_REF_NAME, but clipper/__init__.py says $in_package"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: tag a commit that has merged"; exit 1; }
          # the lines of the "## <version> (...)" section, up to the next "## " heading
          awk -v v="$version" '/^## /{ on = ($2 == v); next } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "::error::CHANGELOG.md has no '## $version' section"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the wheel and sdist
        run: uv build
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "clipper $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
