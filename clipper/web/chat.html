<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6f73">
<title>Clippa chat</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/chat.css">
</head>
<body>
<main class="desk">

  <section class="win buddies" id="buddies" aria-label="Buddy list">
    <header class="bar">
      <span class="bar-icon" aria-hidden="true"></span>
      <span class="bar-title">Clippa's buddies</span>
      <button class="bar-btn" id="fold" type="button" aria-expanded="true" title="Fold the list">_</button>
    </header>
    <div class="buddy-body" id="buddy-body">
      <div class="me-line"><span class="dot" id="me-dot"></span><b>You</b> <span id="me-state">available</span></div>
      <div class="pane inset">
        <details open>
          <summary>Assistant <span class="count">(1/1)</span></summary>
          <ul class="list">
            <li class="buddy online"><span class="dot"></span><span class="name">Clippa</span><span class="note">here to help</span></li>
          </ul>
        </details>
        <details open>
          <summary>The crew <span class="count" id="crew-count"></span></summary>
          <ul class="list" id="crew"><li class="buddy unknown"><span class="dot"></span><span class="name">checking…</span></li></ul>
        </details>
      </div>
      <p class="legend"><span class="dot online"></span>busy <span class="dot idle"></span>idle <span class="dot away"></span>away <span class="dot offline"></span>off</p>
    </div>
  </section>

  <section class="win im" aria-label="Chat with Clippa">
    <header class="bar">
      <span class="bar-icon" aria-hidden="true"></span>
      <span class="bar-title">Clippa · instant message</span>
      <button class="bar-btn" id="bye" type="button" title="End this topic (/bye)">×</button>
    </header>
    <nav class="tools" aria-label="Chat commands">
      <button type="button" class="btn" data-cmd="/new" title="Start a fresh topic">New topic</button>
      <button type="button" class="btn" data-cmd="/history">History</button>
      <button type="button" class="btn" data-cmd="/cost">Cost</button>
      <button type="button" class="btn" id="away" data-cmd="/away">Away</button>
      <button type="button" class="btn" data-cmd="/help">Help</button>
    </nav>
    <div class="log pane inset" id="log" role="log" aria-live="polite"></div>
    <div class="status" id="status">Connecting…</div>
    <form class="compose" id="compose" autocomplete="off">
      <textarea id="box" class="inset" rows="2" maxlength="2000" placeholder="Tell Clippa what to do… (Enter sends)" aria-label="Message"></textarea>
      <button type="submit" class="btn send" id="send">Send</button>
    </form>
  </section>

</main>
<script src="/chat.js"></script>
</body>
</html>
