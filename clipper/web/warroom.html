<!doctype html>
<html lang="en" data-theme="warroom">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111215">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="War Room">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Clippa War Room</title>
<link rel="stylesheet" href="warroom.css">
<!-- the look: one file in web/themes/ (structure in warroom.css, every colour there), picked by
     theme.js; the chat docked at the side wears the same one -->
<link rel="stylesheet" href="themes/warroom.css" id="theme">
<script src="theme.js" data-old-key="clippa-chat-theme"></script>
</head>
<body>
<!-- The page's one icon set: line icons on a 24-unit grid, drawn in the text colour (warroom.css .ic).
     Markup uses <svg class="ic" aria-hidden="true"><use href="#i-name"/></svg>; scripts call ic("name") (core.js). -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-review" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-schedule" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-pipeline" viewBox="0 0 24 24"><path d="M22 12h-4l-3 8-6-16-3 8H2"/></symbol>
  <symbol id="i-money" viewBox="0 0 24 24"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
  <symbol id="i-stats" viewBox="0 0 24 24"><path d="M3 3v18h18M8 17v-5M13 17V8M18 17v-8"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24"><path d="M21 12a9 9 0 0 1-15.4 6.4L3 16M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5M3 21v-5h5"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
  <symbol id="i-reopen" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
  <symbol id="i-popout" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1"/></symbol>
  <symbol id="i-expand" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 17v5M9 4h6l-1 6 3 3v2H7v-2l3-3z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-said" viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/></symbol>
  <symbol id="i-face" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-heat" viewBox="0 0 24 24"><path d="M12 22a7 7 0 0 0 7-7c0-3-2-5.5-4-7.5-.5 2-1.5 3.5-3 4 .5-3.5-1-7-4-9.5C8 5 5 8.5 5 15a7 7 0 0 0 7 7z"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M3 12h13M11 6l6 6-6 6M21 5v14"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-gaps" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></symbol>
  <symbol id="i-selectall" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-wait" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M17 2v4l-5 6-5-6V2M7 22v-4l5-6 5 6v4"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  <symbol id="i-keys" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></symbol>
</svg>
<!-- One row: the name, the live shows, four status widgets (each opens its page), the chat and a menu
     for the actions that change things. The pages sit in the bar under it (a phone: at the bottom). -->
<header>
  <div class="brand">CLIPPA <b>//</b> WAR ROOM</div>
  <div class="lives" id="lives"></div>
  <div class="widgets" id="widgets">
    <button class="widget" id="wUploads" data-go="schedule" title="Uploads in the last 24 hours, against the cap"><span class="lbl">Uploads</span><span class="meter"><i></i></span><b>–</b></button>
    <button class="widget" id="wSpend" data-go="money" title="What the models and Modal cost this month"><span class="lbl">Spend</span><b>–</b></button>
    <button class="widget" id="wPipe" data-go="pipeline" title="Streams being recorded or processed"><span class="lbl">Pipeline</span><b>–</b></button>
    <button class="widget" id="wHealth" data-go="pipeline" title="How old the numbers on this page are"><span class="dot"></span><b>–</b><span class="lbl" id="updated"></span></button>
  </div>
  <button class="btn" id="palBtn" aria-label="Search" aria-haspopup="dialog" aria-controls="palette" title="Go to a page, find an item, run an action"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><span class="pl">Search</span><kbd>Ctrl K</kbd></button>
  <button class="btn" id="chatBtn" aria-controls="chat" title="The Clippa chat at the side: show or hide it (M)"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg>Chat<span class="n" id="chatN"></span></button>
  <button class="btn" id="moreBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="moreMenu" title="Sync Kitsu, replan, the log, keyboard shortcuts" aria-label="More"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
  <div class="menu" id="moreMenu" role="menu" hidden>
    <button class="mi" id="syncBtn" role="menuitem" title="Read decisions and edits from Kitsu now"><svg class="ic" aria-hidden="true"><use href="#i-sync"/></svg>Sync Kitsu</button>
    <button class="mi" id="replanBtn" role="menuitem" title="Rerun clipper schedule"><svg class="ic" aria-hidden="true"><use href="#i-schedule"/></svg>Replan</button>
    <button class="mi" id="undoBtn" role="menuitem" title="The last 20 war room actions, to undo"><svg class="ic" aria-hidden="true"><use href="#i-undo"/></svg>Undo…</button>
    <div class="sep"></div>
    <button class="mi" data-menu-log role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-pipeline"/></svg>The serve and bot log</button>
    <button class="mi" id="keysBtn" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-keys"/></svg>Keyboard shortcuts <kbd>?</kbd></button>
    <button class="mi" data-go="settings" role="menuitem"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg>Look and keys…</button>
  </div>
</header>
<nav class="views" id="views" aria-label="Pages">
  <button data-view="queue"><svg class="ic" aria-hidden="true"><use href="#i-review"/></svg>Review <span class="n" id="vnQueue"></span></button>
  <button data-view="schedule"><svg class="ic" aria-hidden="true"><use href="#i-schedule"/></svg>Schedule <span class="n warn" id="vnSched" title="Approved, with no slot yet"></span></button>
  <button data-view="pipeline"><svg class="ic" aria-hidden="true"><use href="#i-pipeline"/></svg>Pipeline</button>
  <button data-view="money" class="wide"><svg class="ic" aria-hidden="true"><use href="#i-money"/></svg>Money</button>
  <button data-view="stats" class="wide"><svg class="ic" aria-hidden="true"><use href="#i-stats"/></svg>Stats</button>
  <button data-view="library" class="wide"><svg class="ic" aria-hidden="true"><use href="#i-library"/></svg>Library</button>
  <button data-view="research" class="wide"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>Research</button>
  <button data-view="settings" class="wide"><svg class="ic" aria-hidden="true"><use href="#i-settings"/></svg>Settings</button>
  <button data-view="chat" class="narrow"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg>Chat <span class="n" id="vnChat"></span></button>
  <button class="narrow" id="pagesMore" aria-haspopup="menu" aria-expanded="false" aria-controls="pagesMenu"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg>More</button>
</nav>
<div class="menu" id="pagesMenu" role="menu" hidden>
  <button class="mi" data-palette role="menuitem">Search…</button>
  <button class="mi" data-go="money" role="menuitem">Money</button>
  <button class="mi" data-go="stats" role="menuitem">Stats</button>
  <button class="mi" data-go="library" role="menuitem">Library</button>
  <button class="mi" data-go="research" role="menuitem">Research</button>
  <button class="mi" data-go="settings" role="menuitem">Settings</button>
</div>

<!-- Each page is a group of panels; body[data-view] says which one shows (app.js setView). -->
<main>
  <div class="page" data-page="queue">
    <section class="panel" id="vQueue" data-panel="queue">
      <h2>Review queue <span class="sp" id="queueSub"></span></h2>
      <div class="queue-bar" id="queueBar"></div>
      <div class="bulk" id="bulk" hidden></div>
      <div class="grid" id="grid"><div class="sr-only" role="status">Loading the queue</div><div class="skel-card"><i class="th"></i><i></i><i></i></div><div class="skel-card"><i class="th"></i><i></i><i></i></div><div class="skel-card"><i class="th"></i><i></i><i></i></div><div class="skel-card"><i class="th"></i><i></i><i></i></div><div class="skel-card"><i class="th"></i><i></i><i></i></div><div class="skel-card"><i class="th"></i><i></i><i></i></div></div>
    </section>
    <!-- the item window: docked here beside the grid on a wide screen (review.js openModal), a window on top elsewhere -->
    <dialog id="modal" aria-label="The clip"></dialog>
  </div>

  <div class="page" data-page="schedule">
    <section class="panel nextup" id="nextUp" aria-label="Next up"><div class="skel" role="status" aria-label="Loading"><i></i><i></i></div></section>
    <section class="panel" id="vSched" data-panel="schedule">
      <h2>Schedule <span class="sp" id="schedSub"></span>
        <span class="seg" role="group" aria-label="View"><button data-sview="week" aria-pressed="true">Week</button><button data-sview="list" aria-pressed="false">List</button></span>
        <span class="wknav" id="wkNav"><button class="btn sm" id="wkPrev" aria-label="Earlier week" title="Earlier week"><svg class="ic" aria-hidden="true"><use href="#i-left"/></svg></button><span id="wkLabel"></span><button class="btn sm" id="wkNext" aria-label="Later week" title="Later week"><svg class="ic" aria-hidden="true"><use href="#i-right"/></svg></button></span></h2>
      <div class="sched-tools" id="schedTools"></div>
      <div class="wkwrap" id="week"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div>
      <div class="sched" id="schedule" hidden></div>
    </section>
    <aside class="panel" id="vTray" data-panel="tray">
      <h2>Ready to slot <span class="sp" id="traySub" title="Approved, with no slot yet: the number on the Schedule tab"></span></h2>
      <div class="unslotted" id="unslotted"></div>
      <h2 class="sub-h">Uploads</h2>
      <div class="uploads" id="uploads"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div>
    </aside>
  </div>

  <div class="page" data-page="pipeline">
    <section class="panel" data-panel="pipeline"><h2>Pipeline <span class="sp" id="pipeSub"></span></h2><div id="streams"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></section>
    <section class="panel" data-panel="health"><h2>Health <button class="btn sm" id="logBtn" title="The serve and bot logs: where errors go">Log</button></h2><div class="health" id="health"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></section>
  </div>

  <div class="page" data-page="money">
    <section class="panel" data-panel="costs"><h2>Costs <span class="sp" id="costSub"></span></h2><div class="cloud" id="costs"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></section>
    <section class="panel" data-panel="modal"><h2>Modal <span class="sp" id="cloudSub"></span></h2><div class="cloud" id="cloud"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></section>
    <section class="panel" data-panel="usage"><h2>API usage <span class="sp" id="usageSub"></span></h2><div class="cloud" id="usage"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></section>
  </div>

  <div class="page" data-page="stats">
    <section class="panel" id="vStats" data-panel="stats">
      <h2>Analytics <span class="sp" id="statsSub"></span>
        <select id="statsMonth" style="margin-left:auto" title="Month"></select></h2>
      <div class="stats" id="stats"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div>
    </section>
  </div>

  <!-- These open today's windows; they move into their pages in a later step. -->
  <div class="page" data-page="library">
    <section class="panel"><h2>Library</h2><div class="launch">
      <button class="tile" id="castBtn"><b>Cast</b><span>Photos of each regular, for covers and the weekly: kept and new, image search, labels.</span></button>
      <div class="tile off"><b>Faces</b><span>Name a stream's face groups from its row on the <button class="lnk" data-go="pipeline">Pipeline</button> page (<svg class="ic" aria-hidden="true"><use href="#i-face"/></svg>faces).</span></div>
    </div></section>
  </div>

  <div class="page" data-page="research">
    <section class="panel"><h2>Research</h2><div class="launch">
      <button class="tile" id="newsBtn"><b>News</b><span>Headlines about the shows' people (clipper news).</span></button>
      <button class="tile" id="blindsBtn"><b>Blinds</b><span>Gossip blind items: say who you think it is, first (clipper blinds).</span></button>
      <button class="tile" id="invBtn"><b>Investigations</b><span>Leads from an archive subject's own videos (clipper investigate).</span></button>
    </div></section>
  </div>

  <div class="page" data-page="settings">
    <section class="panel"><h2>Settings</h2><div class="launch">
      <button class="tile" id="apikeysBtn"><b>Keys</b><span>API keys: where each comes from, and whether its provider still takes it (clipper keys).</span></button>
      <button class="tile" data-keys-tile><b>Keyboard shortcuts</b><span>Every key the war room answers. <kbd>?</kbd> shows them anywhere.</span></button>
    </div></section>
    <section class="panel"><h2>Look</h2><div class="looks" id="looks"><div class="skel" role="status" aria-label="Loading"><i></i><i></i><i></i></div></div></section>
  </div>
</main>
<!-- #158: the Clippa chat is /chat itself in a frame, so the two share one code path and one store -->
<aside id="chat" aria-label="Clippa chat">
  <div class="c-head"><span>Clippa</span><span class="sp"></span>
    <a class="btn" href="/chat" target="_blank" rel="noopener" title="Open the chat on a page of its own" aria-label="Open the chat on a page of its own"><svg class="ic" aria-hidden="true"><use href="#i-external"/></svg></a>
    <button class="btn" id="chatHide" type="button" title="Hide the chat (M)" aria-label="Hide the chat"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <iframe id="chatFrame" src="/chat?dock" title="Clippa chat"></iframe>
</aside>

<dialog id="keys"></dialog>
<dialog id="tool"></dialog>
<dialog id="palette" aria-label="Go to a page, find an item, run an action"></dialog>
<div id="dock" hidden></div>
<div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<!-- Classic scripts in this order share one global scope; app.js starts the page. -->
<script src="js/core.js"></script>
<script src="js/review.js"></script>
<script src="js/panels.js"></script>
<script src="js/schedule.js"></script>
<script src="js/faces.js"></script>
<script src="js/cast.js"></script>
<script src="js/news.js"></script>
<script src="js/blinds.js"></script>
<script src="js/investigate.js"></script>
<script src="js/heat.js"></script>
<script src="js/apikeys.js"></script>
<script src="js/chatdock.js"></script>
<script src="js/palette.js"></script>
<script src="js/app.js"></script>
</body>
</html>
