# Claude Code on the NAS (#65): a `claude remote-control` session in its own clone of the
# repo, reachable from the Claude app on the phone. The NAS dials out to Anthropic; nothing is
# exposed. deploy.sh puts this next to .env (from env.local), the Anthropic key file and the
# build context. Its own compose project, so deploying it never restarts the recorder or the
# hub, and deploying the hub never ends a Claude session.
name: clippa-claude   # was clipper-claude (#286 pass 3): deploy.sh stops and retires that one first

services:
  claude:
    build: ./src
    image: clippa-claude:latest
    container_name: clippa-claude   # `docker attach clippa-claude` answers its first prompts
    hostname: clippa-nas
    restart: unless-stopped
    init: true                  # clippa stages and Claude's tools run as child processes
    tty: true                   # remote-control asks to be enabled and to trust /app once
    stdin_open: true
    user: "${PUID:-1000}:${PGID:-10}"
    group_add: ["${RENDER_GID:-105}"]   # /dev/dri/renderD128 for QSV, as in the hub
    network_mode: host          # the war room on 127.0.0.1, as in the hub
    env_file: .env              # without ANTHROPIC_API_KEY: Remote Control refuses API-key auth
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      CLIPPA_CUT_BACKEND: local
      CLIPPA_YOUTUBE_COOKIES_FROM_BROWSER: ""
      CLIPPA_PATHS_ANTHROPIC_KEY: /run/secrets/anthropic_key   # clippa's model calls
      # The same in the old spelling, for a session on a branch from before #286 pass 1 (which
      # reads only CLIPPER_*); #286's last pass drops these
      CLIPPER_CUT_BACKEND: local
      CLIPPER_YOUTUBE_COOKIES_FROM_BROWSER: ""
      CLIPPER_PATHS_ANTHROPIC_KEY: /run/secrets/anthropic_key
      # Memory (#435): the laptop's Hindsight bank, through the same plugin (entrypoint.sh).
      # HINDSIGHT_SERVER_MODE, _API_URL, _API_TOKEN and _BANK_ID come from .env. The laptop seeds
      # the bank from git and surveys the code; here the clone is called /app, so doing either
      # would add a second copy under another name. This one reads and writes back its sessions.
      HINDSIGHT_GIT_INGEST: none
      HINDSIGHT_AUTO_SEED: "false"
      HINDSIGHT_CODEBASE_SURVEY: "false"
      HINDSIGHT_AUTO_UPDATE: "false"   # the image pins the plugin's version
    secrets:
      - anthropic_key
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${CLIPPA_DATA:-/volume1/docker/clipper}:/data   # deploy.sh sets CLIPPA_DATA (env.local's, or its old CLIPPER_DATA)
      - ${CLIPPA_DATA:-/volume1/docker/clipper}/fonts:/usr/local/share/fonts/clippa:ro
      # The clone (/app) and Claude Code's home (sign-in, settings, memory, uv cache) persist
      # across deploys; deploy.sh makes both folders as the ssh user, so they belong to PUID.
      - ${CLAUDE_DIR:-/volume1/docker/clipper-claude}/repo:/app
      - ${CLAUDE_DIR:-/volume1/docker/clipper-claude}/home:/home/claude
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

secrets:
  anthropic_key:
    file: ./anthropic_key
