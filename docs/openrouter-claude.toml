# Same Claude models, through OpenRouter. Paste these tables into clipper.toml. Do not
# replace that file: it still holds the shows, paths and ids. Copy it first to
# backups/clipper.toml.before_openrouter_<date> beside it.
#
# Needs OPENROUTER_API_KEY, or the key file at [paths] openrouter_key
# (secrets/openrouter_secret.txt when that path is the default). A set environment
# variable wins over the file. clipper.local.toml and CLIPPER_* still win over this.
#
# Roll back by restoring that copy. Putting a bare claude-* name back on one key sends
# that stage to the Claude API again.
#
# Clippa's ids use hyphens (claude-haiku-5-5). OpenRouter's catalog ids use a dot
# (anthropic/claude-haiku-5.5, and the same for Sonnet and Opus). Checked against
# GET https://openrouter.ai/api/v1/models. Effort keys are not here: each stage keeps
# the effort it already has (low, medium or high; none of these is "none").
#
# No [llm.prices] rows. A --dry-run prices an openrouter: model from the table, then
# from OpenRouter's public /models list (one fetch per process; a failed fetch is
# remembered, and the line says the model was counted as $0). A real call still uses
# the cost OpenRouter reports.

[preshow]
model = "openrouter:anthropic/claude-sonnet-5.5"  # was claude-sonnet-5-5; effort stays medium

[cast]
label_model = "openrouter:anthropic/claude-haiku-5.5"  # was claude-haiku-5-5; label_effort stays low

