planner_effort = "low"
worker_model = "claude-haiku-5-5"
worker_effort = "low"

[story]
dossier_model = "claude-sonnet-5-5"
dossier_effort = "medium"
edit_model = "claude-sonnet-5-5"
edit_effort = "medium"
triage_model = "claude-haiku-5-5"
